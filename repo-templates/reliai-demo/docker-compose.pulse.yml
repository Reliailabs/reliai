services:
  web:
    image: reliai-demo-pulse
    build:
      context: ../..
      dockerfile: apps/pulse/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://api:8000
      RELIAI_DEV_AUTH_ENABLED: "true"
    ports:
      - "3005:3005"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3005').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  dashboard-banner:
    command:
      [
        "/bin/sh",
        "-c",
        "until wget -qO- http://web:3005 >/dev/null 2>&1; do sleep 1; done; echo ''; echo 'Reliai Pulse demo running.'; echo 'Dashboard:'; echo 'http://localhost:3005'; echo '';",
      ]
