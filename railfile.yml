name: reliai

services:
  - name: api
    type: docker
    dockerfile: apps/api/Dockerfile
    buildContext: .
    env:
      DATABASE_URL: ${postgres.DATABASE_URL}
      REDIS_URL: ${redis.REDIS_URL}
    envSecure:
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET}
      AUTH_SESSION_HASH_SECRET: ${AUTH_SESSION_HASH_SECRET}
    startCommand: cd apps/api && uvicorn app.main:app --host 0.0.0.0 --port 8000

  - name: web
    type: docker
    dockerfile: apps/web/Dockerfile
    buildContext: .
    env:
      API_URL: ${api.URL}
      NEXT_PUBLIC_API_URL: ${api.URL}
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
    startCommand: node apps/web/.next/standalone/apps/web/server.js

  - name: worker
    type: docker
    dockerfile: apps/api/Dockerfile
    buildContext: .
    env:
      DATABASE_URL: ${postgres.DATABASE_URL}
      REDIS_URL: ${redis.REDIS_URL}
    startCommand: cd apps/api && PYTHONPATH=/app/apps/api python -m app.scripts.rq_worker

postgres:
  - name: postgres
    engine: postgres16
    databaseName: reliai
    user: reliai

redis:
  - name: redis
    engine: redis7
    maxmemoryPolicy: noeviction