name: reliai
services:
  # API service
  - name: api
    type: docker
    dockerfile: apps/api/Dockerfile
    buildContext: .
    env:
      DATABASE_URL: ${postgres.DATABASE_URL}
      REDIS_URL: ${redis.REDIS_URL}
    envSecure:
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET}
      AUTH_SESSION_HASH_SECRET: ${AUTH_SESSION_HASH_SECRET}

  # Web frontend
  - name: web
    type: docker
    dockerfile: apps/web/Dockerfile
    buildContext: .
    env:
      API_URL: ${api.URL}
      NEXT_PUBLIC_API_URL: ${api.URL}
    envSecure:
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}

volumes:
  # PostgreSQL database
  - name: postgres-data
    type: postgres
    size: 10

  # Redis cache (managed service)
  - name: redis
    type: redis
    size: 1