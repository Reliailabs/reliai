services:
  postgres:
    image: postgres:16-alpine
    container_name: reliai-postgres
    environment:
      POSTGRES_DB: reliai
      POSTGRES_USER: reliai
      POSTGRES_PASSWORD: reliai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliai"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: reliai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: reliai-api
    env_file:
      - .env
    environment:
      # Use Railway auto-injected DATABASE_URL and REDIS_URL when available
      # For local development, set in .env file
      DATABASE_URL: postgresql+psycopg://reliai:reliai@postgres:5432/reliai
      REDIS_URL: redis://redis:6379/0
      RELIAI_SKIP_REDIS_WAIT: ${RELIAI_SKIP_REDIS_WAIT:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: reliai-worker
    env_file:
      - .env
    environment:
      # Use Railway auto-injected DATABASE_URL and REDIS_URL when available
      # For local development, set in .env file
      DATABASE_URL: postgresql+psycopg://reliai:reliai@postgres:5432/reliai
      REDIS_URL: redis://redis:6379/0
      RELIAI_SKIP_REDIS_WAIT: ${RELIAI_SKIP_REDIS_WAIT:-}
    command: ["python", "-m", "app.scripts.rq_worker"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: reliai-web
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
